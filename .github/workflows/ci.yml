name: CI

# Pull requests and manual runs only. A merge to main is the same diff the pull request already built, and a tag
# is gated by release.yml on its own, so building the merge push again only spent macOS minutes, which bill at ten
# times the Linux rate: two builds a change, about eighty billed minutes, used the month's allowance in a day.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'packaging/**'
  workflow_dispatch:

# A superseded push to the same pull request must not keep building.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macos-15
    runs-on: macos-15
    # macos-15 is the gate; macos-latest tracks whatever GitHub moves to next and is allowed to fail.
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        # The package is developed on the current Command Line Tools; use the newest stable Xcode the image has.
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          swift --version

      - name: Build (release)
        # A warning from anything under Sources/ fails the build; Vendor/ is exempt.
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log
          if grep -E '/Sources/[^:]+:[0-9]+:[0-9]+: warning:' build.log; then
            echo "::error::compiler warnings originating under Sources/"
            exit 1
          fi

      - name: Test
        run: scripts/test.sh

      - name: Assemble Notchmeter.app
        run: scripts/build.sh

      - name: Zip the app bundle
        run: ditto -c -k --keepParent build/Notchmeter.app build/Notchmeter.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Notchmeter-macos-15
          path: build/Notchmeter.zip
          if-no-files-found: error
