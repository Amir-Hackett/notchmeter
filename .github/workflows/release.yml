name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  icon:
    name: Tahoe icon
    # Xcode 26's actool is the only thing that compiles packaging/AppIcon.icon, and it crashes when it runs on
    # macOS 15: the asset agent dies with IBPlatformToolFailureException however sound the document, which was
    # proved by compiling the same document on both runners (docs/release.md, "The icon"). So the icon is compiled
    # here, on a macOS 26 runner, and handed to the release job as an artifact; the release itself stays where it
    # has always been. A failure leaves the release to carry the hand-drawn .icns alone rather than stopping it.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compile it
        run: |
          [ -d packaging/AppIcon.icon ] || { echo "no icon document in this tree"; exit 0; }
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          out=build/icon-compile
          mkdir -p "$out"
          min="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' scripts/Info.plist)"
          xcrun actool packaging/AppIcon.icon --compile "$out" \
            --output-format human-readable-text --notices --warnings --errors \
            --output-partial-info-plist "$out/AppIcon-partial.plist" \
            --app-icon AppIcon --include-all-app-icons \
            --enable-on-demand-resources NO --development-region en \
            --target-device mac --platform macosx --minimum-deployment-target "$min"
          ls -la "$out"
          test -f "$out/Assets.car"
      - uses: actions/upload-artifact@v4
        with:
          name: tahoe-icon
          path: build/icon-compile/Assets.car
          if-no-files-found: warn

  release:
    name: ${{ github.ref_name }}
    # Stable tags only. A beta (v0.2.0-beta.1) is published by hand, docs/release.md "Each release", because its
    # appcast item has to be merged into the current stable release's feed, which this job does not do.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-15
    # A normal run takes about twelve minutes, notarisation included; this only stops a stalled step holding the
    # runner for GitHub's six hours.
    timeout-minutes: 60
    needs: icon
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # The car the macOS 26 job compiled, when it got one. scripts/build.sh ignores a path with nothing at it, so
      # a skipped or failed icon job leaves the release carrying the hand-drawn .icns alone.
      ICON_ASSETS_CAR: ${{ github.workspace }}/build/icon-prebuilt/Assets.car
    steps:
      - uses: actions/checkout@v4
        with:
          # BUILD_NUMBER is the commit count, which needs the whole history.
          fetch-depth: 0

      - name: Toolchain
        # An Xcode 26 by preference: its actool is what compiles packaging/AppIcon.icon, the Liquid Glass icon for
        # macOS 26, into the bundle (scripts/build.sh; docs/release.md, "The icon"). The newest stable Xcode of any
        # major otherwise, and the image's default if there is none; the build itself needs no Xcode at all.
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -n 1 || true)"
          [ -n "$xcode" ] || xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          swift --version
          xcrun --find actool || echo "no actool: the Tahoe icon will not be compiled into this build"

      - name: Take the Tahoe icon the macOS 26 job compiled
        # Its absence is not a failure: the release then carries the hand-drawn .icns alone, which is what every
        # macOS before 26 shows anyway. ICON_ASSETS_CAR is what scripts/build.sh reads.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tahoe-icon
          path: build/icon-prebuilt

      - name: Build (release)
        # CI's gate, repeated here so the release path carries it on its own: a warning from anything
        # under Sources/ fails the release before anything is signed, notarised or published. Vendor/ is
        # exempt. ci.yml builds pull requests and manual runs, not the merge push and not the tag, so a tag
        # pushed from a branch that skipped one, or a workflow switched off to save minutes, still meets the
        # same check here.
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log
          if grep -E '/Sources/[^:]+:[0-9]+:[0-9]+: warning:' build.log; then
            echo "::error::compiler warnings originating under Sources/"
            exit 1
          fi

      - name: Test
        run: scripts/test.sh

      - name: Decide whether this release can be signed
        id: mode
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          DEVELOPER_ID_APP_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=""
          for name in DEVELOPER_ID_APP DEVELOPER_ID_APP_P12 DEVELOPER_ID_APP_P12_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER SPARKLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the signing identity and notarisation credentials
        if: steps.mode.outputs.signed == 'true'
        env:
          DEVELOPER_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          DEVELOPER_ID_APP_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_APP_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_APP_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials notchmeter --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Fetch the previous appcast so its items survive
        # release.sh also downloads the DMGs its items point at, checks each against its item's signature, and diffs
        # them against the new build for the delta updates. Without a feed there are simply no deltas.
        run: |
          mkdir -p previous
          gh release download --pattern appcast.xml --dir previous || echo "no published appcast yet"

      - name: Build, sign, notarise and generate the appcast
        if: steps.mode.outputs.signed == 'true'
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          NOTARY_PROFILE: notchmeter
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # Optional. Set it and the app is signed with scripts/Notchmeter.entitlements, so the running-out and
          # waiting-for-you notices break through a Focus; leave it unset and the app claims no entitlements and
          # those notices arrive at the ordinary level. release.sh refuses to publish the entitlements without it.
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$PROVISION_PROFILE_BASE64" ]; then
            # Decoded in Python, not with `base64 --decode`: macOS ships the BSD one, whose decode flag is -D and
            # which does not document the GNU long option, and whichever way the secret was encoded the value may
            # or may not carry line breaks. b64decode does not care about either.
            python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["PROVISION_PROFILE_BASE64"]))' \
              > "$RUNNER_TEMP/embedded.provisionprofile"
            # A profile is CMS-signed; if this cannot read one, the secret is not a profile and the release would
            # otherwise fail later, in the entitlement gate, with a message about the wrong thing.
            security cms -D -i "$RUNNER_TEMP/embedded.provisionprofile" > /dev/null 2>&1 \
              || { echo "::error title=PROVISION_PROFILE_BASE64 is not a provisioning profile::The secret decoded to something \`security cms\` cannot read. Re-run the base64 line in docs/release.md against the .provisionprofile Apple gave you, and check the filename matched."; exit 1; }
            export PROVISION_PROFILE="$RUNNER_TEMP/embedded.provisionprofile"
          fi
          # The release notes Sparkle shows in the update alert, embedded in the appcast item from the file
          # tracked for this version (docs/release.md, "Release notes"). Guarded so a tag whose notes were
          # never written still ships, with the link to the release page alone, rather than failing after
          # notarisation has been spent.
          notes="docs/release-notes/${TAG#v}.md"
          if [ -s "$notes" ]; then
            export RELEASE_NOTES="$notes"
          else
            echo "::warning::$notes is missing or empty; the appcast item carries only the link to the release page"
          fi
          VERSION="${TAG#v}" PREVIOUS_APPCAST=previous/appcast.xml scripts/release.sh
          rm -f "$RUNNER_TEMP/embedded.provisionprofile"

      - name: Build unsigned (signing secrets missing)
        if: steps.mode.outputs.signed != 'true'
        run: |
          notes="docs/release-notes/${TAG#v}.md"
          if [ -s "$notes" ]; then export RELEASE_NOTES="$notes"; fi
          VERSION="${TAG#v}" scripts/release.sh --dry-run

      - name: Publish to the GitHub release
        id: publish
        # One publisher per tag. A release that already carries a Notchmeter.dmg was published by someone, by hand or
        # by an earlier run of this job, and installed copies may already have been offered it; this step never
        # replaces that file, and the uploads below carry no --clobber, so a race with another publisher fails rather
        # than deletes. An unsigned run that finds one stands down, green: a hand-published release firing this
        # workflow through its own tag is the documented path. A signed run that finds one is two publishers, an error.
        # Publishing again is a new tag, or deleting the asset first, on purpose.
        run: |
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx Notchmeter.dmg; then
            if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then
              echo "::error::$TAG already carries a Notchmeter.dmg; refusing to replace a published build. Bump the version and tag again, or delete the asset first if this re-run is deliberate."
              exit 1
            fi
            echo "::notice::$TAG already carries a Notchmeter.dmg (published by hand, or by an earlier run); standing down without touching it."
            echo "outcome=stood-down" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then
            # Published as a prerelease, always, however green this run is. `releases/latest` is what installed
            # copies update from through SUFeedURL and what `brew` installs, and nothing reaches it until a person
            # or an agent has installed the DMG and opened the app. v0.2.0 passed codesign, notarisation, spctl,
            # its checksum, its appcast signature and lipo, and could not launch on any Mac: not one of those runs
            # the app, and this workflow still does not. Promotion is a separate, deliberate step afterwards:
            #   gh release edit "$TAG" --prerelease=false --latest
            # .claude/skills/release/SKILL.md, step 6 (install it and open it) then step 7 (promote).
            gh release view "$TAG" > /dev/null 2>&1 \
              || gh release create "$TAG" --title "Notchmeter ${TAG#v}" --generate-notes --prerelease
            # Forced back to prerelease before the assets land, so there is never a window in which a
            # non-prerelease release carries a build nobody has launched.
            gh release edit "$TAG" --prerelease > /dev/null
            # The delta updates release.sh made from the builds the previous feed offers, when it made any. The new
            # feed points at them on this tag, beside the DMG, so they go up with it (docs/release.md, "Delta updates").
            shopt -s nullglob
            deltas=(dist/*.delta)
            gh release upload "$TAG" dist/Notchmeter.dmg ${deltas[@]+"${deltas[@]}"} dist/appcast.xml
            echo "outcome=signed" >> "$GITHUB_OUTPUT"
          else
            # A prerelease keeps releases/latest, and with it SUFeedURL, on the last signed build; no appcast is uploaded
            # because an ad-hoc build can never be installed as an update, nor the deltas the dry run makes from its
            # stand-in. And an ad-hoc build never goes onto a release
            # that is not a prerelease: that page is where people who trust Gatekeeper download from.
            if gh release view "$TAG" > /dev/null 2>&1; then
              if [ "$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)" != "true" ]; then
                echo "::error::$TAG is a published release; refusing to put an unsigned build on it. Set the signing secrets (docs/release.md, step 5) and re-run."
                exit 1
              fi
            else
              gh release create "$TAG" --title "Notchmeter ${TAG#v} (unsigned)" --generate-notes --prerelease
            fi
            gh release upload "$TAG" dist/Notchmeter.dmg
            echo "outcome=unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          if [ "${{ steps.publish.outputs.outcome }}" = "stood-down" ]; then
            {
              echo "## Notchmeter ${TAG#v}: already published"
              echo "The $TAG release already carried a Notchmeter.dmg, published by hand (docs/release.md, path b) or by an earlier run; this run built, then stood down without touching it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sha="$(shasum -a 256 dist/Notchmeter.dmg | cut -d ' ' -f 1)"
          if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then
            {
              echo "## Notchmeter ${TAG#v}: signed **prerelease**"
              echo "Universal Notchmeter.dmg (Developer ID, hardened runtime, notarised, stapled) and appcast.xml uploaded to the $TAG release."
              deltas="$(cd dist && ls *.delta 2>/dev/null | tr '\n' ' ' || true)"
              echo
              echo "Delta updates: ${deltas:-none, so every copy downloads the full DMG (the build log says why)}"
              echo
              echo "It is a prerelease on purpose. \`releases/latest\` still points at the last promoted build, so no installed copy is offered this one yet."
              echo
              echo "Install the DMG and open it before promoting - that is the only check here that runs the app, and it is the one v0.2.0 needed:"
              echo
              echo '```'
              echo "gh release download $TAG --pattern Notchmeter.dmg --dir /tmp/nm-verify --clobber"
              echo "# install to /Applications, then:"
              echo "/Applications/Notchmeter.app/Contents/MacOS/Notchmeter --cli --help; echo \"exit \$?\"   # 137 means do not promote"
              echo "gh release edit $TAG --prerelease=false --latest"
              echo '```'
              echo
              echo "DMG sha256 \`$sha\` for packaging/homebrew/notchmeter.rb."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Notchmeter ${TAG#v}: UNSIGNED build"
              echo "Signing secrets missing:${{ steps.mode.outputs.missing }}."
              echo
              echo "Uploaded an ad-hoc-signed Notchmeter.dmg to the $TAG **prerelease**. Gatekeeper refuses it on other Macs, the in-app updater stays inactive, and no appcast was published. docs/release.md lists the secrets to set."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
