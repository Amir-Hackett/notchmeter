name: Icon probe
on:
  workflow_dispatch:
  push:
    branches: [icon/tahoe]
    paths: ['.github/workflows/icon-probe.yml', 'packaging/AppIcon.icon/**']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Which tools
        run: |
          sw_vers
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -n 1 || true)"
          [ -n "$xcode" ] && sudo xcode-select -s "$xcode"
          xcode-select -p
          xcrun --find actool
          "$(xcrun --find actool)" --version | head -20
      - name: Compile the repository's document
        run: |
          set +e
          out=$(mktemp -d)
          xcrun actool "$PWD/packaging/AppIcon.icon" --compile "$out" \
            --output-format human-readable-text --notices --warnings --errors \
            --output-partial-info-plist "$out/partial.plist" \
            --app-icon AppIcon --include-all-app-icons \
            --enable-on-demand-resources NO --development-region en \
            --target-device mac --platform macosx --minimum-deployment-target 14.0 2>&1
          echo "== exit $? =="
          ls -la "$out"
      - name: Compile a control document in the shipping minimal shape
        run: |
          set +e
          ctl="$RUNNER_TEMP/Control.icon"
          mkdir -p "$ctl/Assets"
          cp packaging/AppIcon.icon/Assets/arc.png "$ctl/Assets/arc.png"
          cat > "$ctl/icon.json" <<'JSON'
          {
            "fill" : { "solid" : "srgb:0.08000,0.08000,0.08000,1.00000" },
            "groups" : [ { "layers" : [ { "glass" : true, "hidden" : false, "image-name" : "arc.png", "name" : "arc",
                  "position" : { "scale" : 1, "translation-in-points" : [ 0, 0 ] } } ],
                "shadow" : { "kind" : "neutral", "opacity" : 0.5 },
                "translucency" : { "enabled" : true, "value" : 0.5 } } ],
            "supported-platforms" : { "circles" : [ "watchOS" ], "squares" : "shared" }
          }
JSON
          sed -i '' 's/^          //' "$ctl/icon.json" 2>/dev/null || sed -i 's/^          //' "$ctl/icon.json"
          cat "$ctl/icon.json"
          out=$(mktemp -d)
          xcrun actool "$ctl" --compile "$out" \
            --output-format human-readable-text --notices --warnings --errors \
            --app-icon Control --include-all-app-icons \
            --enable-on-demand-resources NO --development-region en \
            --target-device mac --platform macosx --minimum-deployment-target 14.0 2>&1
          echo "== exit $? =="
          ls -la "$out"
