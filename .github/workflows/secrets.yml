name: Secrets

# Two jobs, both on Linux minutes and both seconds to run, separate from CI so the Markdown-only path filter
# there never skips them. gitleaks goes over the whole history on every push and pull request, so a key that
# slips into a commit is caught on dev before it can reach main; a hit fails the check and prints the file and
# commit, redacted. The second job answers the opposite question: whether the seven secrets release.yml needs
# in order to sign, notarise and publish a tag exist at all, so nobody learns they are missing from a tag that
# ships an unsigned prerelease. It names the empty ones and never prints a value.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # The action reads the pull request's commit list and, when it finds a leak, comments on the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  release-readiness:
    name: release secrets present
    # A fork's pull request is given no secrets and would report all seven missing; same-repository events only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
      DEVELOPER_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
      DEVELOPER_ID_APP_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_P12_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Name the release secrets that are empty
        # The same test release.yml makes before it decides whether a tag can be signed; names only, never a value.
        run: |
          missing=""
          for name in DEVELOPER_ID_APP DEVELOPER_ID_APP_P12 DEVELOPER_ID_APP_P12_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER SPARKLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "release secrets: all seven set"
            {
              echo "## Release path: armed"
              echo "All seven signing secrets are set. A \`v*\` tag signs, notarises and publishes (docs/release.md, step 5)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release secrets missing:$missing"
            echo "::warning title=Release secrets missing::$missing. A v* tag builds an unsigned prerelease until these exist (docs/release.md, step 5)."
            {
              echo "## Release path: not armed"
              echo "Missing:$missing."
              echo
              echo "A \`v*\` tag builds an unsigned prerelease until these exist; docs/release.md, step 5, has the \`gh secret set\` lines."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
