name: Secrets

# gitleaks over the whole history on every push and pull request, so a key that slips into a commit is caught
# on dev before it can reach main. Linux minutes, seconds to run; separate from CI so the Markdown-only path
# filter there never skips it. A hit fails the check and prints the file and commit, redacted.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
