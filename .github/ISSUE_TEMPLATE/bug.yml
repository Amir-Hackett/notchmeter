name: Bug
description: Something on screen, in a reading or in a notification is wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings › Advanced › Copy diagnostics, then paste. It carries the last 10 minutes of the app's own log, each assistant's status, the hook and status-line state, the layout and the macOS version, with your home folder scrubbed; never a token. Turn on Debug logging first if the problem is a vendor answering oddly, and reproduce it before copying.
      render: text
  - type: textarea
    id: smoke
    attributes:
      label: --smoke output (optional)
      description: Run `/Applications/Notchmeter.app/Contents/MacOS/Notchmeter --smoke` (add `--edge left` etc. to match your layout) and paste the output. It prints readings as labels and percentages only, never a token.
      render: text
  - type: input
    id: setup
    attributes:
      label: Mac, macOS, displays
      description: e.g. 14-inch M5 Pro, macOS 26.6, one external display as main.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have checked that nothing pasted above contains a token, an account id or transcript text.
          required: true
